<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthia</title><style>body{font-family:system-ui;background:#0d0d10;color:#eee;margin:0;padding:20px}main{max-width:760px;margin:auto}textarea{width:100%;min-height:120px;background:#18181d;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;box-sizing:border-box}button{padding:12px 18px;border-radius:10px;border:0;font-weight:700}.perms{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}pre{white-space:pre-wrap;background:#141419;padding:14px;border-radius:12px;min-height:120px}</style></head><body><main><h1>Synthia</h1><p id="status">booting…</p><div class="perms"><label><input id="execution" type="checkbox"> hands</label><label><input id="network" type="checkbox"> network</label><label><input id="files" type="checkbox"> files</label></div><textarea id="input" placeholder="Give Synthia something to work on."></textarea><p><button id="send">Send</button></p><pre id="output"></pre></main><script type="module" src="./main.mjs"></script></body></html>
